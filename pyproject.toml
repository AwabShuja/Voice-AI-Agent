[project]
name = "voice-patient-registration"
version = "0.1.0"
description = "Voice patient registration with FastAPI, SQLite, Vapi, and Gemini. Synthetic data only."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "phonenumberslite>=9,<10",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
